<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="logo">
    <img src="logoo.jfif" alt="">
   </div>

    <div class="form-box">
        
   <div class="heading">
    <h1>OFFICE OF THE UNIVERSITY SAFETY <br> KWASU MALETE</h1>
   </div>

   <div class="passport">
   </div>

   <div class="name">
    <h2>STUDENT SAFETY FORM></h2>
   </div>

   <form action="">
    <div class="top">
        <label for="FOR">FOR</label>
        <input type="for" name="" id="">

        <label for="SESSION">SESSION</label>
        <input type="session" name="" id="">
    </div>


    <H2>(A)PERSONAL DATA</H2>
     
    <div class="surname">
    <label for="NAME IN FULL (SURNAME FIRST)">NAME IN FULL(SURNAME FIRST)</label>
    <input type="name in full(surname)" id="name">
    </div>
     
    <div class="state">
    <label for="STATE OF ORIGIN/LGA">STATE OF ORGIN/LGA</label>
    <input type="state of origin" id="state">
    </div>

    <div class="nationality">
    <label for="NATIONALITY">NATIONALITY</label>
    <input type="nationality" id="nationality">

    <label for="tribe">TRIBE</label>
    <input type="tribe" id="tribe">

    <label for="religion">RELIGION</label>
    <input type="religion" id="religion">
    </div>

    <div class="tell">
    <label for="PHONE NO(S)">PHONE NO(S)</label>
    <input type="tell" name="" id="tell">
    </div>

    <div class="status">
        <label for="marital status">MARITAL STATUS</label>
        <input type="marital status" id="marital">

        <label for="no of childen">NO OF CHILDEN</label>
        <input type="number" id="number">
    </div>

    <div class="INFORMATION">
        <label for="NAME,ADDRESS & PHONE NO OF SPOUSE(IF MARRIED)">NAME,ADRESS & PHONE NO OF SPOUSE (IF MARRIED)</label>
        <input type="address" id="address">
    </div>

    <div class="KIN">
        <label for="kin">KIN</label>
        <input type="kin" id="kin">

        <label for="RELATIONSHIP">RELATIONSHIP</label>
        <input type="relationship" id="relationship">
    </div>

    <div class="ADDRESS">
        <label for="address of next of kin">ADDRESS OF NEXT OF KIN</label>
        <input type="address of next of kin" id="address">
    </div>

    <div>
        <label for="FATHER/GUADIANS NAME ADDRESS & PHONE NO(S)">FATHER/GUADIANS NAME ADDRESS &PHONE NO</label>
        <input type="name" id="name">
    </div>

    
    <div class="SPONSORS">
        <label for="SPONSORS NAME,ADDRESS & PHONE NO(S)">SPONSORS NAME,ADDRESS & PHONE NO(S)</label>
        <input type="tell" id="name">
    </div>
    <hr>
   

   
    <h3>(B) COURSE DATA</h3>

    <div class="admitted">
        <label for="course admitted for">COURSE ADMITTEDN FOR</label>
        <input type="course" id="course">
    </div>

    <div class="details">
        <label for="college">COLLEGE</label>
        <input type="college" id="college">

        <label for="department">DEPARTMENT</label>
        <input type="department" id="department">
    </div>

    <div class="hint">
        <label for="jamb reg. no">JAMB REG. NO</label>
        <input type="number" id="number">

        <label for="matric no.">MATRIC NO.</label>
        <input type="number" id="number">
    </div>
    <hr>

    <h4>(C) ACCOMODATION</h4>
    <label for="">NAME OF HOSTEL(OR OFFICE CAMPUS RESIDENTIAL ADDRESS)</label>
    <input type="name" id="name">
    <hr>

    <h2>(D) DECLERATION</h2>
    <div>
    <label for="">I SOLEMLY DECLARE THAT THE INFORMATION GIVEN IN THIS FORM IS CORRECT TO THE BEST OF <br>
         MY KNOWLEDGE THAT IF ANY FALSE INFORMATION GIVEN HERE SHALL ATTACT APPROPRIATE <br>
          PUNISHMENT FROM THE KWASU AUTHORITY.</label>
    </div>

    


          <label for="">I VOW TO ABIDE BY THE RULE AND REGULATION OF THE UNIVERSITY AND ALSO THAT I AM NOT <br> A MEMBER OF ANY SECRET CUT OR UNIVERSITY ASSOCIATION.</label>

    </div>

    <div class="Signature">
        <div>
            <input type="text" name="text" id="text">
            <p>STUDENT'S SIGNATURE</p>
        </div>

        <div>
            <input type="text" name="text" id="text">
            <p>CHIEF SAFETY OFFICER</p>
            <p>(NAME AND SIGNATURE)</p>
        </div>

    </div>

    <div class="thumb">
        <h3>THUMB PRINTS</h3>

        <div class="thumb-box"></div>
        <div class="thumb-box"></div>
    </div>
   
</form>



   
</body>
</html>
